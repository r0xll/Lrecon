[project]
name = "lrecon"
version = "3.2.0"
description = "External attack-surface recon orchestrator for authorized pentests"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "dnspython>=2.6",
    "rich>=13.0",
    "mmh3>=4.0",
]

[project.scripts]
lrecon = "lrecon.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lrecon*"]

[project.optional-dependencies]
screenshots = ["playwright>=1.40"]
# Live TLS certificate inspection (SAN mining, origin confirmation, expiry /
# self-signed flags). Optional so the base install stays minimal — without it
# the cert pass logs once and skips, like the other optional backends.
tls = ["cryptography>=42"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "cryptography>=42"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
