[project]
name = "lrecon"
version = "3.2.0"
description = "External attack-surface recon orchestrator for authorized pentests"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "dnspython>=2.6",
    "rich>=13.0",
    "mmh3>=4.0",
    # Live TLS certificate inspection. Was an extra, on the theory that the base
    # install should stay minimal — but reading the cert a host actually serves
    # is core to an attack-surface tool (SAN mining, Cloudflare origin
    # confirmation, expired/self-signed flags), and shipping it off by default
    # meant `pip install -e .` silently produced reports missing a whole
    # section. It is a normal wheel with no build step on every supported
    # platform, exactly like the four above.
    "cryptography>=42",
]

[project.scripts]
lrecon = "lrecon.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lrecon*"]

# Ship the bundled brute-force wordlist inside the wheel so --brute works with
# no SecLists install (loaded via importlib.resources).
[tool.setuptools.package-data]
lrecon = ["data/*.txt"]

[project.optional-dependencies]
screenshots = ["playwright>=1.40"]
# Kept as an empty extra so `pip install 'lrecon[tls]'` — in older docs, scripts
# and shell history — still resolves instead of erroring on an unknown extra.
# cryptography moved into the base dependencies; nothing to add here.
tls = []
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
